<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMAWA - Wedding Planning Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            min-height: 100vh;
            padding: 2rem;
        }

        nav {
            display: flex;
            align-items: center;
            margin-bottom: 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            color: #333;
            text-decoration: none;
        }

        .logo-text {
            color: #00bfa5;
            font-weight: bold;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .form-container {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .form-title {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 2rem;
            text-align: center;
        }

        .form-section {
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: #f8f9fa;
            border-radius: 0.5rem;
        }

        .section-title {
            font-size: 1.2rem;
            color: #00bfa5;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #00bfa5;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn-container {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 2rem;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-primary {
            background: #00bfa5;
            color: white;
        }

        .btn-secondary {
            background: #f1f1f1;
            color: #333;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .budget-range {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .budget-display {
            min-width: 100px;
            text-align: center;
            font-weight: bold;
            color: #00bfa5;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#" class="logo">
            <span>💍</span>
            <span class="logo-text">SAMAWA</span>
        </a>
    </nav>

    <div class="container">
        <form class="form-container" action="/submit-form" method="POST">
            <h1 class="form-title">Wedding Planning Details</h1>

            <!-- Couple Details Section -->
            <div class="form-section">
                <h2 class="section-title">👰 Couple Details</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="bride-name">Bride's Name</label>
                        <input type="text" id="bride-name" name="brideName" required>
                    </div>
                    <div class="form-group">
                        <label for="groom-name">Groom's Name</label>
                        <input type="text" id="groom-name" name="groomName" required>
                    </div>
                    <div class="form-group">
                        <label for="contact-email">Contact Email</label>
                        <input type="email" id="contact-email" name="contactEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="contact-phone">Contact Phone</label>
                        <input type="tel" id="contact-phone" name="contactPhone" required>
                    </div>
                </div>
            </div>

            <!-- Event Details Section -->
            <div class="form-section">
                <h2 class="section-title">📅 Event Details</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="wedding-date">Wedding Date</label>
                        <input type="date" id="wedding-date" name="weddingDate" required>
                    </div>
                    <div class="form-group">
                        <label for="guest-count">Guest Count</label>
                        <input type="number" id="guest-count" name="guestCount" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="venue-name">Venue Name</label>
                        <input type="text" id="venue-name" name="venueName" required>
                    </div>
                    <div class="form-group">
                        <label for="venue-location">Venue Location</label>
                        <input type="text" id="venue-location" name="venueLocation" required>
                    </div>
                </div>
            </div>

            <!-- Services Section with Dropdowns -->
            <div class="form-section">
                <h2 class="section-title">💫 Services Required</h2>
                <div class="form-group">
                    <label for="photography-videography">Photography & Videography</label>
                    <select id="photography-videography" name="photography_videography" required>
                        <option value="">Select a package</option>
                        <option value="Basic Package">Basic Package</option>
                        <option value="Premium Package">Premium Package</option>
                        <option value="Full Package">Full Package</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="catering">Catering</label>
                    <select id="catering" name="catering" required>
                        <option value="">Select a catering style</option>
                        <option value="Buffet Style">Buffet Style</option>
                        <option value="Plated Service">Plated Service</option>
                        <option value="Cocktail Style">Cocktail Style</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="makeup-styling">Makeup & Styling</label>
                    <select id="makeup-styling" name="makeup_styling" required>
                        <option value="">Select a package</option>
                        <option value="Basic Styling">Basic Styling</option>
                        <option value="Full Styling Package">Full Styling Package</option>
                        <option value="Premium Package">Premium Package</option>
                    </select>
                </div>
            </div>

            <!-- Budget Details Section -->
            <div class="form-section">
                <h2 class="section-title">💰 Budget Details</h2>
                <div class="form-group">
                    <label for="budget">Budget Range</label>
                    <div class="budget-range">
                        <input type="range" id="budget" name="budget" min="100000" max="2000000" step="50000" value="500000"
                            oninput="this.nextElementSibling.textContent = '₹' + this.value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',')">
                        <span class="budget-display">₹500,000</span>
                    </div>
                </div>
            </div>

            <!-- Additional Notes Section -->
            <div class="form-section">
                <h2 class="section-title">📝 Additional Notes</h2>
                <div class="form-group">
                    <textarea id="notes" name="notes" placeholder="Any special requests or additional details you'd like to share..."></textarea>
                </div>
            </div>

            <!-- Buttons -->
            <div class="btn-container">
                <button type="button" class="btn btn-secondary">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Details</button>
            </div>
        </form>
    </div>
</body>
</html>
